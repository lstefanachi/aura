function setPhoto(file){
 var rd=new FileReader();
 rd.onload=function(){var im=new Image();im.onload=function(){
  var z=128,c=document.createElement("canvas");c.width=c.height=z;
  var m=Math.min(im.width,im.height);
  c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);
  saveProf(c.toDataURL("image/jpeg",0.75));
 };im.src=rd.result};
 rd.readAsDataURL(file);
}
