<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f5f1ea;--card:#fff;--tx:#1c1f24;--mu:#6d6a66;--ac:#7b3fa0;--ac2:#efe3f6;--bd:#e6dfd4;--er:#b3261e;--nav:#1c1f24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#15171a;--card:#202327;--tx:#eceae6;--mu:#a09c96;--ac:#a56bdb;--ac2:#2d1f3a;--bd:#32353a;--er:#f2b8b5;--nav:#0d0e10}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#15171a;--card:#202327;--tx:#eceae6;--mu:#a09c96;--ac:#a56bdb;--ac2:#2d1f3a;--bd:#32353a;--er:#f2b8b5;--nav:#0d0e10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:repeating-linear-gradient(180deg,#7b3fa0 0 22px,#fff 22px 24px);color:#fff;padding:22px 14px 18px 18px;position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ht{min-width:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0;font:italic 900 clamp(24px,7.4vw,34px)/1 "Arial Black",Impact,system-ui,sans-serif;text-transform:uppercase;letter-spacing:-.5px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.hero p{margin:6px 0 0;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
main{max-width:560px;margin:0 auto;padding:14px 16px 110px}
h2{font:italic 800 18px/1.2 "Arial Black",system-ui,sans-serif;text-transform:uppercase;margin:18px 0 8px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ath{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:left;color:var(--tx);font:inherit;width:100%}

function serieScore(s){
 var t=String(s||"").trim().toLowerCase();
 if(!t)return 0;
 var total=0;
 t.split(/[+,;\/]+/).forEach(function(part){
  var nums=part.match(/\d+(?:[.,]\d+)?/g);
  if(!nums)return;
  if(/[x×*]/.test(part)&&nums.length>=2){
   var prod=1;
   nums.forEach(function(n){prod*=(parseFloat(n.replace(",","."))||0)});
   total+=prod;
  }else{
   total+=(parseFloat(nums[0].replace(",","."))||0);
  }
 });
 return total;
}

function getAura(k){
 // Gare: each discipline keeps only the athlete's best result (1 PB per discipline)

 S.gare.forEach(function(r){
  if(keyOf(r)===k&&r.gara&&r.ris)garePB[r.gara]=r.ris;
 });
 var pbG=Object.keys(garePB).length;

 // Pesi: count distinct exercises/variants where the athlete has a valid PR (> 0 kg),
 // plus bonus points for improvements (higher kg, or equal kg with strictly higher serie x ripetizioni)
 var pesiByEx={};
 S.pesi.forEach(function(r){
  if(keyOf(r)===k&&r.es){
   var kg=parseFloat(r.kg);
   if(!isNaN(kg)&&kg>0){
    var e=pesoExKey(r);
    if(!pesiByEx[e])pesiByEx[e]=[];
    pesiByEx[e].push({kg:kg,ser:serieScore(r.serie),ts:r.ts||0,d:r.data||""});
   }
  }
 });
 var pbP=0,impP=0;
 Object.keys(pesiByEx).forEach(function(e){
  var arr=pesiByEx[e].slice().sort(function(a,b){return a.d.localeCompare(b.d)||a.ts-b.ts});
  var curKg=0,curSer=-1;
  arr.forEach(function(item){
   if(curKg===0){
    pbP++;curKg=item.kg;curSer=item.ser;
   }else if(isBetterPeso(item.kg,item.ser,curKg,curSer)){
    impP++;curKg=item.kg;curSer=item.ser;
   }
  });
 });

 // Points ONLY from Personal Bests:
 // +20 pt for each Gare PB, +15 pt for each Pesi PR exercise, +10 pt for each Pesi PR beaten
 var pts=(pbG*20)+(pbP*15)+(impP*10);
 var lv=AURA_LV[0],next=null;

  if(pts>=AURA_LV[i].min){lv=AURA_LV[i];next=AURA_LV[i+1]||null}
 }
 var pct=next?Math.min(100,Math.round(((pts-lv.min)/(next.min-lv.min))*100)):100;
 return {pts:pts,lv:lv,next:next,pct:pct,pbG:pbG,pbP:pbP,impP:impP};
}
